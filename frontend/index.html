<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Transit Tracker - Relationship Astrology</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
            color: #333;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        header {
            background: white;
            border-radius: 12px;
            padding: 30px;
            margin-bottom: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        h1 {
            color: #667eea;
            margin-bottom: 10px;
        }

        .subtitle {
            color: #666;
            font-size: 14px;
        }

        .controls {
            background: white;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            align-items: end;
        }

        .control-group {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        label {
            font-size: 12px;
            font-weight: 600;
            color: #666;
            text-transform: uppercase;
        }

        select, input[type="date"], button {
            padding: 10px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 14px;
            font-family: inherit;
        }

        select, input[type="date"] {
            background: white;
            cursor: pointer;
        }

        button {
            background: #667eea;
            color: white;
            border: none;
            cursor: pointer;
            font-weight: 600;
            transition: background 0.3s;
        }

        button:hover {
            background: #5568d3;
        }

        button:disabled {
            background: #ccc;
            cursor: not-allowed;
        }

        .dashboard {
            background: white;
            border-radius: 12px;
            padding: 30px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            margin-bottom: 20px;
        }

        .summary {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            border-radius: 8px;
            text-align: center;
        }

        .stat-value {
            font-size: 32px;
            font-weight: bold;
            margin-bottom: 5px;
        }

        .stat-label {
            font-size: 12px;
            opacity: 0.9;
            text-transform: uppercase;
        }

        .aspects-list {
            margin-top: 20px;
        }

        .aspect-card {
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 15px;
            transition: all 0.3s;
        }

        .aspect-card:hover {
            border-color: #667eea;
            box-shadow: 0 2px 8px rgba(102, 126, 234, 0.2);
        }

        .aspect-card.critical {
            border-left: 4px solid #e74c3c;
        }

        .aspect-card.high {
            border-left: 4px solid #f39c12;
        }

        .aspect-card.medium {
            border-left: 4px solid #3498db;
        }

        .aspect-card.low {
            border-left: 4px solid #95a5a6;
        }

        .aspect-header {
            display: flex;
            justify-content: space-between;
            align-items: start;
            margin-bottom: 15px;
        }

        .aspect-title {
            font-size: 18px;
            font-weight: 600;
            color: #333;
        }

        .aspect-badges {
            display: flex;
            gap: 8px;
        }

        .badge {
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
        }

        .badge.applying {
            background: #3498db;
            color: white;
        }

        .badge.separating {
            background: #95a5a6;
            color: white;
        }

        .badge.challenging {
            background: #e74c3c;
            color: white;
        }

        .badge.supportive {
            background: #2ecc71;
            color: white;
        }

        .aspect-details {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            font-size: 14px;
            color: #666;
        }

        .detail-item {
            display: flex;
            flex-direction: column;
            gap: 3px;
        }

        .detail-label {
            font-size: 11px;
            text-transform: uppercase;
            color: #999;
            font-weight: 600;
        }

        .detail-value {
            font-size: 14px;
            color: #333;
            font-weight: 500;
        }

        .strength-bar {
            width: 100%;
            height: 8px;
            background: #e0e0e0;
            border-radius: 4px;
            overflow: hidden;
            margin-top: 5px;
        }

        .strength-fill {
            height: 100%;
            background: linear-gradient(90deg, #667eea 0%, #764ba2 100%);
            transition: width 0.3s;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: #666;
        }

        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .error {
            background: #fee;
            border: 2px solid #e74c3c;
            border-radius: 8px;
            padding: 20px;
            color: #c0392b;
            margin-bottom: 20px;
        }

        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            border-bottom: 2px solid #e0e0e0;
        }

        .tab {
            padding: 12px 24px;
            background: none;
            border: none;
            border-bottom: 3px solid transparent;
            cursor: pointer;
            font-weight: 600;
            color: #666;
            transition: all 0.3s;
        }

        .tab.active {
            color: #667eea;
            border-bottom-color: #667eea;
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        @media (max-width: 768px) {
            .controls {
                flex-direction: column;
            }

            .aspect-details {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>✨ Transit Tracker</h1>
            <p class="subtitle">Relationship Astrology & Transit Analysis</p>
        </header>

        <div class="controls">
            <div class="control-group">
                <label for="chart-select">Chart</label>
                <select id="chart-select">
                    <option value="christina">Christina</option>
                    <option value="julian" selected>Julian</option>
                    <option value="davison">Davison (Midpoint)</option>
                </select>
            </div>

            <div class="control-group">
                <label for="date-input">Date</label>
                <input type="date" id="date-input">
            </div>

            <div class="control-group">
                <label for="time-input">Time (Pacific)</label>
                <input type="time" id="time-input" value="12:00">
            </div>

            <div class="control-group">
                <label>&nbsp;</label>
                <button id="now-btn">Now</button>
            </div>

            <div class="control-group">
                <label>&nbsp;</label>
                <button id="load-btn">Load Transits</button>
            </div>
        </div>

        <div id="error-container"></div>

        <div class="tabs">
            <button class="tab active" data-tab="dashboard">Daily Dashboard</button>
            <button class="tab" data-tab="scanner">Transit Scanner</button>
            <button class="tab" data-tab="compare">Compare Charts</button>
        </div>

        <div id="dashboard-tab" class="tab-content active">
            <div class="dashboard">
                <div id="dashboard-content">
                    <div class="loading">
                        <div class="spinner"></div>
                        <p>Loading transits...</p>
                    </div>
                </div>
            </div>
        </div>

        <div id="scanner-tab" class="tab-content">
            <div class="dashboard">
                <h2 style="margin-bottom: 20px;">Upcoming Exact Transits</h2>
                <div class="controls" style="margin-bottom: 20px;">
                    <div class="control-group">
                        <label for="scan-start">Start Date</label>
                        <input type="date" id="scan-start">
                    </div>
                    <div class="control-group">
                        <label for="scan-end">End Date</label>
                        <input type="date" id="scan-end">
                    </div>
                    <div class="control-group">
                        <label>&nbsp;</label>
                        <button id="scan-btn">Scan Transits</button>
                    </div>
                </div>
                <div id="scanner-content">
                    <p style="color: #666;">Select date range and click "Scan Transits" to find upcoming exact aspects.</p>
                </div>
            </div>
        </div>

        <div id="compare-tab" class="tab-content">
            <div class="dashboard">
                <h2 style="margin-bottom: 20px;">Compare All Charts</h2>
                <div id="compare-content">
                    <p style="color: #666;">Click "Load Transits" to compare transits across all three charts.</p>
                </div>
            </div>
        </div>
    </div>

    <script>
        const API_URL = window.location.hostname === 'localhost'
            ? 'http://localhost:5000'
            : '';

        // Initialize date and time inputs
        const now = new Date();
        const today = now.toISOString().split('T')[0];
        const currentTime = now.toTimeString().slice(0, 5);

        document.getElementById('date-input').value = today;
        document.getElementById('time-input').value = currentTime;
        document.getElementById('scan-start').value = today;

        const endDate = new Date();
        endDate.setDate(endDate.getDate() + 120);
        document.getElementById('scan-end').value = endDate.toISOString().split('T')[0];

        // Tab handling
        document.querySelectorAll('.tab').forEach(tab => {
            tab.addEventListener('click', () => {
                document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
                document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));

                tab.classList.add('active');
                document.getElementById(tab.dataset.tab + '-tab').classList.add('active');
            });
        });

        // Event listeners
        document.getElementById('now-btn').addEventListener('click', () => {
            const now = new Date();
            document.getElementById('date-input').value = now.toISOString().split('T')[0];
            document.getElementById('time-input').value = now.toTimeString().slice(0, 5);
        });

        document.getElementById('load-btn').addEventListener('click', loadDashboard);
        document.getElementById('scan-btn').addEventListener('click', scanTransits);

        // Load on page load
        loadDashboard();

        async function loadDashboard() {
            const chart = document.getElementById('chart-select').value;
            const date = document.getElementById('date-input').value;
            const time = document.getElementById('time-input').value;

            showLoading('dashboard-content');
            clearError();

            try {
                const response = await fetch(`${API_URL}/api/dashboard/${chart}?date=${date}&time=${time}`);
                if (!response.ok) throw new Error('Failed to load dashboard');

                const data = await response.json();
                renderDashboard(data);

                // Also load comparison
                loadComparison();
            } catch (error) {
                showError(error.message);
            }
        }

        async function scanTransits() {
            const chart = document.getElementById('chart-select').value;
            const startDate = document.getElementById('scan-start').value;
            const endDate = document.getElementById('scan-end').value;

            showLoading('scanner-content');
            clearError();

            try {
                const response = await fetch(`${API_URL}/api/scan/${chart}?start_date=${startDate}&end_date=${endDate}&min_significance=MEDIUM`);
                if (!response.ok) throw new Error('Failed to scan transits');

                const data = await response.json();
                renderScanner(data);
            } catch (error) {
                showError(error.message);
            }
        }

        async function loadComparison() {
            const date = document.getElementById('date-input').value;
            const time = document.getElementById('time-input').value;

            try {
                const response = await fetch(`${API_URL}/api/compare?date=${date}&time=${time}`);
                if (!response.ok) throw new Error('Failed to load comparison');

                const data = await response.json();
                renderComparison(data);
            } catch (error) {
                console.error('Comparison error:', error);
            }
        }

        function renderDashboard(data) {
            const container = document.getElementById('dashboard-content');

            // Calculate stats
            const critical = data.aspects.filter(a => a.significance === 'CRITICAL').length;
            const high = data.aspects.filter(a => a.significance === 'HIGH').length;
            const challenging = data.aspects.filter(a => a.is_challenging).length;
            const supportive = data.aspects.filter(a => !a.is_challenging).length;

            const html = `
                <div class="summary">
                    <div class="stat-card">
                        <div class="stat-value">${data.total_aspects}</div>
                        <div class="stat-label">Total Aspects</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-value">${critical}</div>
                        <div class="stat-label">Critical</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-value">${high}</div>
                        <div class="stat-label">High Impact</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-value">${challenging} / ${supportive}</div>
                        <div class="stat-label">Challenge / Support</div>
                    </div>
                </div>

                <div style="margin-bottom: 20px;">
                    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
                        <h3>Plain Text (Copy & Paste)</h3>
                        <button onclick="copyPlainText()" style="padding: 8px 16px; font-size: 12px;">Copy to Clipboard</button>
                    </div>
                    <pre id="plain-text-output" style="background: #f5f5f5; padding: 15px; border-radius: 8px; font-size: 12px; white-space: pre-wrap; overflow-x: auto; max-height: 300px; overflow-y: auto;">${data.plain_text || 'Loading...'}</pre>
                </div>

                <h3 style="margin-bottom: 15px;">Active Aspects (${data.aspects.length})</h3>
                <div class="aspects-list">
                    ${data.aspects.map(aspect => renderAspectCard(aspect)).join('')}
                </div>
            `;

            container.innerHTML = html;
        }

        function copyPlainText() {
            const text = document.getElementById('plain-text-output').innerText;
            navigator.clipboard.writeText(text).then(() => {
                const btn = event.target;
                const originalText = btn.innerText;
                btn.innerText = 'Copied!';
                setTimeout(() => { btn.innerText = originalText; }, 2000);
            }).catch(err => {
                console.error('Failed to copy:', err);
                alert('Failed to copy to clipboard');
            });
        }

        function renderAspectCard(aspect) {
            const directionBadge = aspect.is_applying
                ? '<span class="badge applying">→ Applying</span>'
                : '<span class="badge separating">← Separating</span>';

            const typeBadge = aspect.is_challenging
                ? '<span class="badge challenging">⚠️ Challenging</span>'
                : '<span class="badge supportive">✓ Supportive</span>';

            // Format exact date/time
            let exactInfo = 'N/A';
            if (aspect.exact_datetime) {
                const [date, time] = aspect.exact_datetime.split(' ');
                const dateObj = new Date(date + 'T' + time);
                const timeStr = dateObj.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' });
                exactInfo = `${date} ~${timeStr}`;
            } else if (aspect.exact_date) {
                exactInfo = `~${aspect.exact_date}`;
            }

            return `
                <div class="aspect-card ${aspect.significance.toLowerCase()}">
                    <div class="aspect-header">
                        <div class="aspect-title">
                            ${aspect.transit_planet} in ${aspect.transit_sign || ''} ${aspect.aspect_symbol} ${aspect.natal_point}
                        </div>
                        <div class="aspect-badges">
                            ${directionBadge}
                            ${typeBadge}
                        </div>
                    </div>
                    <div class="aspect-details">
                        <div class="detail-item">
                            <span class="detail-label">Current Orb</span>
                            <span class="detail-value">${aspect.orb.toFixed(2)}°</span>
                        </div>
                        <div class="detail-item">
                            <span class="detail-label">Strength</span>
                            <span class="detail-value">${aspect.strength.toFixed(1)}%</span>
                            <div class="strength-bar">
                                <div class="strength-fill" style="width: ${aspect.strength}%"></div>
                            </div>
                        </div>
                        <div class="detail-item">
                            <span class="detail-label">Exact</span>
                            <span class="detail-value">${exactInfo}</span>
                        </div>
                        <div class="detail-item">
                            <span class="detail-label">Significance</span>
                            <span class="detail-value">${aspect.significance}</span>
                        </div>
                    </div>
                </div>
            `;
        }

        function renderScanner(data) {
            const container = document.getElementById('scanner-content');

            if (data.transits.length === 0) {
                container.innerHTML = '<p style="color: #666;">No significant transits found in this date range.</p>';
                return;
            }

            const html = `
                <p style="color: #666; margin-bottom: 20px;">
                    Found ${data.total_found} upcoming exact transits from ${data.start_date} to ${data.end_date}
                </p>
                <div class="aspects-list">
                    ${data.transits.map(transit => `
                        <div class="aspect-card ${transit.significance.toLowerCase()}">
                            <div class="aspect-header">
                                <div class="aspect-title">
                                    ${transit.exact_date}: ${transit.transit_planet} ${transit.aspect} ${transit.natal_point}
                                </div>
                                <div class="aspect-badges">
                                    ${transit.is_challenging ? '<span class="badge challenging">⚠️ Challenging</span>' : '<span class="badge supportive">✓ Supportive</span>'}
                                </div>
                            </div>
                            <div class="aspect-details">
                                <div class="detail-item">
                                    <span class="detail-label">Exact Orb</span>
                                    <span class="detail-value">${transit.exact_orb.toFixed(4)}°</span>
                                </div>
                                <div class="detail-item">
                                    <span class="detail-label">Significance</span>
                                    <span class="detail-value">${transit.significance}</span>
                                </div>
                            </div>
                        </div>
                    `).join('')}
                </div>
            `;

            container.innerHTML = html;
        }

        function renderComparison(data) {
            const container = document.getElementById('compare-content');

            const html = `
                <p style="color: #666; margin-bottom: 20px;">Transit comparison for ${data.date}</p>
                ${Object.entries(data.charts).map(([key, chart]) => `
                    <div style="margin-bottom: 30px;">
                        <h3 style="margin-bottom: 15px;">${chart.name}</h3>
                        <div class="summary">
                            <div class="stat-card">
                                <div class="stat-value">${chart.total_aspects}</div>
                                <div class="stat-label">Total</div>
                            </div>
                            <div class="stat-card">
                                <div class="stat-value">${chart.critical}</div>
                                <div class="stat-label">Critical</div>
                            </div>
                            <div class="stat-card">
                                <div class="stat-value">${chart.high}</div>
                                <div class="stat-label">High</div>
                            </div>
                            <div class="stat-card">
                                <div class="stat-value">${chart.challenging} / ${chart.supportive}</div>
                                <div class="stat-label">Challenge / Support</div>
                            </div>
                        </div>
                        <div class="aspects-list">
                            ${chart.top_aspects.map(aspect => renderAspectCard(aspect)).join('')}
                        </div>
                    </div>
                `).join('')}
            `;

            container.innerHTML = html;
        }

        function showLoading(containerId) {
            const container = document.getElementById(containerId);
            container.innerHTML = `
                <div class="loading">
                    <div class="spinner"></div>
                    <p>Loading...</p>
                </div>
            `;
        }

        function showError(message) {
            const container = document.getElementById('error-container');
            container.innerHTML = `
                <div class="error">
                    <strong>Error:</strong> ${message}
                </div>
            `;
        }

        function clearError() {
            document.getElementById('error-container').innerHTML = '';
        }
    </script>
</body>
</html>
